name: "Reusable workflow to check a single version"
on:
  workflow_call:
    inputs:
      ROS2_CONTROL_PR:
        type: string
      ROS2_CONTROLLERS_PR:
        type: string
      ROS2_CONTROL_DEMOS_PR:
        type: string
      GZ_ROS2_CONTROL_PR:
        type: string
      CONTROL_TOOLBOX_PR:
        type: string
      CONTROL_MSGS_PR:
        type: string
      REALTIME_TOOLS_PR:
        type: string
      KINEMATICS_INTERFACE_PR:
        type: string
      TOPIC_BASED_HARDWARE_INTERFACES_PR:
        type: string
      ROS_CONTROLS_GITHUB_PR:
        type: string
      MUJOCO_ROS2_CONTROL_PR:
        type: string
      ZEPHYR_ZENOH_INTEGRATION_PR:
        type: string

jobs:
  build-single-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        repository: ros-controls/control.ros.org
        ref: ${{ job.workflow_sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade --requirement requirements.txt
      shell: bash
    - name: Install generate_parameter_library
      run: |
        cd
        git clone https://github.com/PickNikRobotics/generate_parameter_library.git
        cd generate_parameter_library/generate_parameter_library_py/
        python -m pip install .
      shell: bash
    - name: Build single version with optional PRs' numbers considering warnings as errors
      env:
        ROS2_CONTROL_PR: ${{ inputs.ROS2_CONTROL_PR }}
        ROS2_CONTROLLERS_PR: ${{ inputs.ROS2_CONTROLLERS_PR }}
        ROS2_CONTROL_DEMOS_PR: ${{ inputs.ROS2_CONTROL_DEMOS_PR }}
        GZ_ROS2_CONTROL_PR: ${{ inputs.GZ_ROS2_CONTROL_PR }}
        CONTROL_TOOLBOX_PR: ${{ inputs.CONTROL_TOOLBOX_PR }}
        CONTROL_MSGS_PR: ${{ inputs.CONTROL_MSGS_PR }}
        REALTIME_TOOLS_PR: ${{ inputs.REALTIME_TOOLS_PR }}
        KINEMATICS_INTERFACE_PR: ${{ inputs.KINEMATICS_INTERFACE_PR }}
        TOPIC_BASED_HARDWARE_INTERFACES_PR: ${{ inputs.TOPIC_BASED_HARDWARE_INTERFACES_PR }}
        ROS_CONTROLS_GITHUB_PR: ${{ inputs.ROS_CONTROLS_GITHUB_PR }}
        MUJOCO_ROS2_CONTROL_PR: ${{ inputs.MUJOCO_ROS2_CONTROL_PR }}
        ZEPHYR_ZENOH_INTEGRATION_PR: ${{ inputs.ZEPHYR_ZENOH_INTEGRATION_PR }}
      run: make html-all-subrepos-with-errors

    # No PDF is built here on purpose to keep the artifact small, see `make pdf-rolling`
    - name: Upload HTML artifact
      uses: actions/upload-artifact@v7
      id: artifact-upload-step
      with:
        name: html-artifacts-${{ github.event.pull_request.number || github.run_id }}
        path: _build/html
        retention-days: 30 # default 90
        compression-level: 9 # maximum compression, default 6
        if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

    - name: Find HTML artifacts link comment
      uses: peter-evans/find-comment@v4
      id: find-comment
      # Skip if not triggered by a pull request or if the PR comes from a fork
      # (https://github.com/peter-evans/create-or-update-comment/issues/444)
      if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: "HTML artifacts:"

    - name: Create or update HTML artifacts link comment
      uses: peter-evans/create-or-update-comment@v5
      # Skip if not triggered by a pull request or if the PR comes from a fork
      # (https://github.com/peter-evans/create-or-update-comment/issues/444)
      if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          HTML artifacts: ${{ steps.artifact-upload-step.outputs.artifact-url }}.

          To view the resulting site:
          1. Click on the above link to download the artifacts archive
          2. Extract it
          3. Open `html-artifacts-${{ github.event.pull_request.number || github.run_id }}/index.html` in your favorite browser
        edit-mode: replace
