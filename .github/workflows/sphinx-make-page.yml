name: "Build & Deploy Page"
on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
  # Run every morning to ensure component documentation is up to date on deployment
   - cron: '23 5 * * *'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade --requirement requirements.txt
      shell: bash
    - name: Install generate_parameter_library
      run: |
        cd
        git clone https://github.com/PickNikRobotics/generate_parameter_library.git
        cd generate_parameter_library/generate_parameter_library_py/
        python -m pip install .
      shell: bash
    - name: Install doxygen, graphviz, and LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz latexmk texlive-fonts-recommended texlive-latex-extra texlive-latex-recommended texlive-plain-generic texlive-xetex fonts-freefont-otf
    - name: Restore stats
      uses: actions/cache/restore@v6
      with:
        key: reviewer-stats-${{ github.run_id }}
        restore-keys: |
          reviewer-stats
        path: ~/reviews
    - name: Build multiversion with API
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        make multiversion-with-api
    - name: Build Rolling PDF
      run: make pdf-rolling
    - name: clone gh-pages branch
      uses: actions/checkout@v7
      if: ${{ success() && github.event_name != 'pull_request' && !env.ACT }}
      with:
        ref: gh-pages
        path: gh-pages
    - name: Deploy Pages
      if: ${{ success() && github.event_name != 'pull_request' && !env.ACT }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/html
        cname: control.ros.org
